<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SahajLipi</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <h1>SahajLipi <span lang="ne">सहजलिपि</span></h1>
    <p id="site" class="site"></p>
    <label class="switch">
      <input type="checkbox" id="toggle" disabled>
      <span>Nepali typing on this site</span>
    </label>
    <p id="note" class="note" role="status"></p>
    <button type="button" id="forget" hidden>Forget this site</button>
    <p class="hint">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>. Works in text boxes and text areas; not in rich editors.</p>
  </main>
</body>
</html>
