name: Extension release

on:
  push:
    tags: ['extension-v*']

permissions:
  contents: read

jobs:
  package:
    name: package and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: npm test
      - run: node tools/package-extension.js --tag "$GITHUB_REF_NAME"
      - run: npx playwright install --with-deps chromium
      - name: Run the extension checks on the packaged files
        env:
          EXTENSION_DIR: ${{ runner.temp }}/unpacked
        run: |
          unzip -q .extension-dist/*.zip -d "$EXTENSION_DIR"
          npm run extension:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-release
          path: .extension-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub prerelease
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-release
      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.zip ./*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "SahajLipi browser extension ${GITHUB_REF_NAME#extension-v}" \
            --notes-file release-notes.md
